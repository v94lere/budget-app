<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Récapitulatif" />
  <title>Récapitulatif</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f4f0; --text: #1a1a18; --text2: #7a7972; --text3: #b0afa8;
      --border: rgba(0,0,0,0.08); --border2: rgba(0,0,0,0.14);
      --accent: #1a1a18; --danger: #c0392b; --radius: 14px; --radius-sm: 9px;
    }
    body { font-family: -apple-system,'SF Pro Text',sans-serif; background:var(--bg); color:var(--text); }
    #setup-screen { display:none; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:32px 24px; gap:24px; }
    .setup-icon { width:72px; height:72px; background:var(--accent); border-radius:20px; display:flex; align-items:center; justify-content:center; font-size:32px; }
    .setup-title { font-size:22px; font-weight:700; text-align:center; }
    .setup-sub { font-size:14px; color:var(--text2); text-align:center; line-height:1.6; max-width:280px; }
    .setup-form { width:100%; max-width:320px; display:flex; flex-direction:column; gap:12px; }
    .setup-form input { width:100%; padding:14px 16px; font-size:16px; border:1.5px solid var(--border2); border-radius:var(--radius-sm); background:#fff; color:var(--text); outline:none; font-family:inherit; }
    .setup-btn { width:100%; padding:14px; font-size:16px; font-weight:600; background:var(--accent); color:#fff; border:none; border-radius:var(--radius-sm); font-family:inherit; }
    .setup-error { font-size:13px; color:var(--danger); text-align:center; min-height:18px; }
    #app-screen { display:none; }
    .app { max-width:430px; margin:0 auto; padding:0 16px; padding-top:env(safe-area-inset-top,0px); }
    .app-header { display:flex; justify-content:space-between; align-items:center; padding:20px 0 16px; }
    .app-title { font-size:28px; font-weight:700; letter-spacing:-0.8px; }
    .header-actions { display:flex; gap:8px; align-items:center; }
    .sync-status { font-size:11px; color:var(--text3); }
    .add-btn { width:44px; height:44px; border-radius:50%; background:var(--accent); border:none; color:#fff; font-size:24px; line-height:44px; text-align:center; display:block; font-family:inherit; }
    .month-nav { display:flex; align-items:center; justify-content:space-between; background:#fff; border-radius:var(--radius); padding:10px 16px; margin-bottom:14px; border:1px solid var(--border); }
    .nav-btn { background:none; border:none; font-size:20px; color:var(--text2); padding:8px 12px; font-family:inherit; }
    .month-label { font-size:15px; font-weight:600; }
    .totals { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px; }
    .total-card { background:#fff; border-radius:var(--radius); padding:14px 16px; border:1px solid var(--border); }
    .total-label { font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:var(--text3); margin-bottom:4px; }
    .total-value { font-size:22px; font-weight:700; }
    .section-title { font-size:13px; font-weight:600; color:var(--text2); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:10px; }
    .entries { display:flex; flex-direction:column; gap:8px; padding-bottom:40px; }
    .entry { background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:13px 14px; }
    .entry-main { display:flex; justify-content:space-between; align-items:center; gap:12px; }
    .entry-left { flex:1; min-width:0; }
    .entry-title { font-size:15px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .entry-date { font-size:12px; color:var(--text3); margin-top:2px; }
    .entry-values { text-align:right; flex-shrink:0; }
    .entry-price { font-size:15px; font-weight:600; }
    .entry-time { font-size:12px; color:var(--text2); margin-top:2px; }
    .del-btn { background:none; border:none; color:var(--text3); font-size:18px; padding:6px; min-width:32px; min-height:32px; font-family:inherit; }
    .empty { text-align:center; padding:48px 0 32px; color:var(--text2); font-size:14px; line-height:2; }
    #modal-wrap { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:100; align-items:flex-end; justify-content:center; }
    #modal-wrap.open { display:flex; }
    #modal-box { background:#fff; border-radius:24px 24px 0 0; padding:28px 20px 50px; width:100%; max-width:430px; max-height:85vh; overflow-y:auto; animation:slideUp .25s ease; }
    @keyframes slideUp { from{transform:translateY(40px);opacity:0} to{transform:translateY(0);opacity:1} }
    .modal-handle { width:36px; height:4px; background:var(--border2); border-radius:2px; margin:0 auto 20px; }
    .modal-title { font-size:18px; font-weight:700; margin-bottom:20px; }
    .field { margin-bottom:14px; }
    .field label { display:block; font-size:12px; font-weight:600; color:var(--text2); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.4px; }
    .field input[type=text], .field input[type=number] { width:100%; padding:13px 14px; font-size:16px; border:1.5px solid var(--border2); border-radius:var(--radius-sm); background:var(--bg); color:var(--text); font-family:inherit; outline:none; display:block; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .modal-actions { display:flex; gap:10px; margin-top:24px; }
    .btn-cancel { flex:1; padding:16px; border:1.5px solid var(--border2); border-radius:var(--radius-sm); background:#fff; font-size:15px; font-family:inherit; color:var(--text2); }
    .btn-save { flex:2; padding:16px; border:none; border-radius:var(--radius-sm); background:var(--accent); color:#fff; font-size:15px; font-weight:600; font-family:inherit; }
    #toast { position:fixed; bottom:32px; left:50%; transform:translateX(-50%); background:#1a1a18; color:#fff; padding:10px 20px; border-radius:20px; font-size:13px; opacity:0; transition:opacity .3s; z-index:500; pointer-events:none; }
    #toast.show { opacity:1; }
  </style>
</head>
<body>

<div id="setup-screen">
  <div class="setup-title">Récapitulatif</div>
  <div class="setup-sub">Configuration initiale.<br>Entrez le code fourni.</div>
  <div class="setup-form">
    <input type="password" id="s-token" placeholder="Code d'accès" autocomplete="off" />
    <div class="setup-error" id="setup-error"></div>
    <button class="setup-btn" onclick="App.setup()">Continuer</button>
  </div>
</div>

<div id="app-screen">
  <div class="app">
    <div class="app-header">
      <span class="app-title">Récapitulatif</span>
      <div class="header-actions">
        <span class="sync-status" id="sync-status"></span>
        <button class="add-btn" onclick="App.openModal()">+</button>
      </div>
    </div>
    <div class="month-nav">
      <button class="nav-btn" onclick="App.changeMonth(-1)">&#8249;</button>
      <span class="month-label" id="month-label"></span>
      <button class="nav-btn" onclick="App.changeMonth(1)">&#8250;</button>
    </div>
    <div class="totals">
      <div class="total-card"><div class="total-label">Total €</div><div class="total-value" id="total-price">—</div></div>
      <div class="total-card"><div class="total-label">Temps</div><div class="total-value" id="total-time">—</div></div>
    </div>
    <div class="section-title">Entrées</div>
    <div class="entries" id="entries-list"></div>
  </div>
</div>

<div id="modal-wrap" onclick="App.onWrapClick(event)">
  <div id="modal-box">
    <div class="modal-handle"></div>
    <div class="modal-title">Nouvelle entrée</div>
    <div class="field">
      <label>Titre</label>
      <input type="text" id="f-title" placeholder="Ex: Courses, Médecin…" autocomplete="off" />
    </div>
    <div class="row">
      <div class="field">
        <label>Prix (€)</label>
        <input type="number" id="f-price" placeholder="0,00" step="0.01" min="0" inputmode="decimal" />
      </div>
      <div class="field">
        <label>Temps (min)</label>
        <input type="number" id="f-time" placeholder="60" min="0" inputmode="numeric" />
      </div>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn-cancel" onclick="App.closeModal()">Annuler</button>
      <button type="button" class="btn-save" onclick="App.doSave()">Ajouter</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
var App = (function() {

  var GIST_ID   = "fe6bbcd9c76caa4c8539f370c6e31dd2";
  var GIST_FILE = "data.json";
  var MONTHS    = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];

  var token    = localStorage.getItem("gh_token") || "";
  var data     = [];
  var curMonth = new Date().getMonth();
  var curYear  = new Date().getFullYear();

  function setup() {
    var val = document.getElementById("s-token").value.trim();
    var err = document.getElementById("setup-error");
    if (!val.startsWith("ghp_") && !val.startsWith("github_pat_")) { err.textContent="Code invalide."; return; }
    err.textContent = "Vérification…";
    fetch("https://api.github.com/gists/"+GIST_ID, { headers:{"Authorization":"token "+val,"Accept":"application/vnd.github.v3+json"} })
      .then(function(r) {
        if (!r.ok) { document.getElementById("setup-error").textContent="Code incorrect ou expiré."; return; }
        localStorage.setItem("gh_token", val);
        token = val;
        document.getElementById("setup-screen").style.display = "none";
        document.getElementById("app-screen").style.display = "block";
        loadData();
      })
      .catch(function(){ document.getElementById("setup-error").textContent="Erreur réseau."; });
  }

  function loadData() {
    setSyncStatus("⏳");
    fetch("https://api.github.com/gists/"+GIST_ID, { headers:{"Authorization":"token "+token,"Accept":"application/vnd.github.v3+json"} })
      .then(function(r){ return r.json(); })
      .then(function(gist){
        var raw = gist.files[GIST_FILE] ? gist.files[GIST_FILE].content : "[]";
        data = JSON.parse(raw);
        setSyncStatus("✓");
        render();
      })
      .catch(function(){
        data = JSON.parse(localStorage.getItem("budget_local")||"[]");
        setSyncStatus("⚠️");
        render();
      });
  }

  function saveData() {
    localStorage.setItem("budget_local", JSON.stringify(data));
    setSyncStatus("⏳");
    var body = {files:{}}; body.files[GIST_FILE] = {content: JSON.stringify(data)};
    fetch("https://api.github.com/gists/"+GIST_ID, {
      method:"PATCH",
      headers:{"Authorization":"token "+token,"Accept":"application/vnd.github.v3+json","Content-Type":"application/json"},
      body: JSON.stringify(body)
    })
    .then(function(r){ setSyncStatus(r.ok?"✓":"⚠️"); showToast(r.ok?"Sauvegardé ✓":"Non synchronisé"); })
    .catch(function(){ setSyncStatus("⚠️"); showToast("Hors ligne"); });
  }

  function setSyncStatus(s) { document.getElementById("sync-status").textContent = s; }
  function showToast(msg) {
    var t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
    setTimeout(function(){ t.classList.remove("show"); }, 2000);
  }

  function fmtP(v){ return Number(v).toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})+" €"; }
  function fmtT(m){ var h=Math.floor(m/60),mn=m%60; return h+"h"+String(mn).padStart(2,"0"); }

  function render() {
    document.getElementById("month-label").textContent = MONTHS[curMonth]+" "+curYear;
    var f = data.filter(function(e){ return e.month===curMonth && e.year===curYear; });
    document.getElementById("total-price").textContent = f.some(function(e){return e.price!=null;}) ? fmtP(f.reduce(function(s,e){return s+(e.price||0);},0)) : "—";
    document.getElementById("total-time").textContent  = f.some(function(e){return e.time!=null;})  ? fmtT(f.reduce(function(s,e){return s+(e.time||0);},0))  : "—";
    var list = document.getElementById("entries-list");
    if (!f.length) { list.innerHTML='<div class="empty">Aucune entrée ce mois-ci.<br>Appuyez sur <strong>+</strong> pour en ajouter.</div>'; return; }
    list.innerHTML = f.slice().reverse().map(function(e){
      return '<div class="entry"><div class="entry-main">'+
        '<div class="entry-left"><div class="entry-title">'+e.title+'</div><div class="entry-date">'+new Date(e.date).toLocaleDateString("fr-FR")+'</div></div>'+
        '<div class="entry-values">'+(e.price!=null?'<div class="entry-price">'+fmtP(e.price)+'</div>':'')+(e.time!=null?'<div class="entry-time">'+fmtT(e.time)+'</div>':'')+'</div>'+
        '<button class="del-btn" onclick="App.delEntry(\''+e.id+'\')">✕</button>'+
        '</div></div>';
    }).join("");
  }

  function changeMonth(d) {
    curMonth+=d; if(curMonth>11){curMonth=0;curYear++;} if(curMonth<0){curMonth=11;curYear--;} render();
  }

  function openModal() {
    document.getElementById("f-title").value = "";
    document.getElementById("f-price").value = "";
    document.getElementById("f-time").value  = "";
    document.getElementById("modal-wrap").classList.add("open");
  }
  function closeModal() { document.getElementById("modal-wrap").classList.remove("open"); }
  function onWrapClick(e) { if(e.target===document.getElementById("modal-wrap")) closeModal(); }

  function doSave() {
    var title = document.getElementById("f-title").value.trim();
    if (!title) { document.getElementById("f-title").focus(); return; }
    var p = document.getElementById("f-price").value;
    var t = document.getElementById("f-time").value;
    data.push({
      id:    Date.now().toString(),
      title: title,
      price: p!==""?parseFloat(p):null,
      time:  t!==""?parseInt(t):null,
      date:  new Date().toISOString(),
      month: curMonth,
      year:  curYear
    });
    closeModal();
    render();
    saveData();
  }

  function delEntry(id) {
    data = data.filter(function(e){ return e.id!==id; });
    render();
    saveData();
  }

  if (!token) {
    document.getElementById("setup-screen").style.display = "flex";
  } else {
    document.getElementById("app-screen").style.display = "block";
    loadData();
  }

  return { setup:setup, openModal:openModal, closeModal:closeModal, onWrapClick:onWrapClick,
           doSave:doSave, changeMonth:changeMonth, delEntry:delEntry };

})();
</script>
</body>
</html>
