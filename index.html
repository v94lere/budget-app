<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Budget" />
  <title>Budget</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #f5f4f0; --surface: #ffffff; --text: #1a1a18; --text2: #7a7972; --text3: #b0afa8;
      --border: rgba(0,0,0,0.08); --border2: rgba(0,0,0,0.14);
      --accent: #1a1a18; --accent-fg: #ffffff; --danger: #c0392b; --warn: #e67e22;
      --radius: 14px; --radius-sm: 9px;
    }
    body { font-family: -apple-system,'SF Pro Text',sans-serif; background: var(--bg); color: var(--text); min-height:100dvh; }

    /* LOGIN */
    #login-screen { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100dvh; padding:32px 24px; gap:28px; }
    .login-icon { width:72px; height:72px; background:var(--accent); border-radius:20px; display:flex; align-items:center; justify-content:center; font-size:32px; }
    .login-title { font-size:26px; font-weight:600; letter-spacing:-0.5px; text-align:center; }
    .login-subtitle { font-size:14px; color:var(--text2); text-align:center; margin-top:6px; }
    .login-form { width:100%; max-width:320px; display:flex; flex-direction:column; gap:12px; }
    .login-form input { width:100%; padding:14px 16px; font-size:16px; border:1.5px solid var(--border2); border-radius:var(--radius-sm); background:#fff; color:var(--text); outline:none; font-family:inherit; letter-spacing:2px; }
    .login-form input:focus { border-color:var(--accent); }
    .login-btn { width:100%; padding:14px; font-size:16px; font-weight:600; background:var(--accent); color:var(--accent-fg); border:none; border-radius:var(--radius-sm); cursor:pointer; font-family:inherit; }
    .login-btn:disabled { opacity:0.4; cursor:not-allowed; }
    .login-error { font-size:13px; color:var(--danger); text-align:center; min-height:18px; }
    .login-warn { font-size:13px; color:var(--warn); text-align:center; min-height:18px; }

    /* APP */
    #app-screen { display:none; }
    .safe-top { height:env(safe-area-inset-top,0px); }
    .safe-bot  { height:calc(env(safe-area-inset-bottom,0px) + 8px); }
    .app { max-width:430px; margin:0 auto; padding:0 16px; }
    .app-header { display:flex; justify-content:space-between; align-items:center; padding:20px 0 16px; }
    .app-title { font-size:28px; font-weight:700; letter-spacing:-0.8px; }
    .header-actions { display:flex; gap:8px; }
    .icon-btn { width:38px; height:38px; border-radius:50%; border:1.5px solid var(--border2); background:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:18px; }
    .add-btn { width:38px; height:38px; border-radius:50%; background:var(--accent); border:none; color:#fff; font-size:22px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
    .month-nav { display:flex; align-items:center; justify-content:space-between; background:#fff; border-radius:var(--radius); padding:10px 16px; margin-bottom:14px; border:1px solid var(--border); }
    .nav-btn { background:none; border:none; font-size:20px; color:var(--text2); cursor:pointer; padding:4px 8px; }
    .month-label { font-size:15px; font-weight:600; }
    .totals { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px; }
    .total-card { background:#fff; border-radius:var(--radius); padding:14px 16px; border:1px solid var(--border); }
    .total-label { font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:var(--text3); margin-bottom:4px; }
    .total-value { font-size:22px; font-weight:700; letter-spacing:-0.5px; }
    .section-title { font-size:13px; font-weight:600; color:var(--text2); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:10px; }
    .entries { display:flex; flex-direction:column; gap:8px; padding-bottom:32px; }
    .entry { background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:13px 14px; }
    .entry-main { display:flex; justify-content:space-between; align-items:center; gap:12px; }
    .entry-left { flex:1; min-width:0; }
    .entry-title { font-size:15px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .entry-date { font-size:12px; color:var(--text3); margin-top:2px; }
    .entry-values { text-align:right; flex-shrink:0; }
    .entry-price { font-size:15px; font-weight:600; }
    .entry-time { font-size:12px; color:var(--text2); margin-top:2px; }
    .entry-actions { display:flex; align-items:center; gap:4px; flex-shrink:0; }
    .del-btn { background:none; border:none; cursor:pointer; color:var(--text3); font-size:16px; padding:4px; line-height:1; }
    .files-row { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; padding-top:10px; border-top:1px solid var(--border); }
    .file-chip { display:flex; align-items:center; gap:5px; background:var(--bg); border:1px solid var(--border2); border-radius:6px; padding:4px 8px; font-size:12px; color:var(--text2); cursor:pointer; max-width:140px; }
    .file-chip span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .empty { text-align:center; padding:48px 0 32px; color:var(--text2); font-size:14px; line-height:2; }

    /* MODAL */
    .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:100; align-items:flex-end; justify-content:center; }
    .overlay.open { display:flex; }
    .modal { background:#fff; border-radius:24px 24px 0 0; padding:28px 20px calc(28px + env(safe-area-inset-bottom,0px)); width:100%; max-width:430px; animation:slideUp .25s ease; max-height:90dvh; overflow-y:auto; }
    @keyframes slideUp { from{transform:translateY(60px);opacity:0} to{transform:translateY(0);opacity:1} }
    .modal-handle { width:36px; height:4px; background:var(--border2); border-radius:2px; margin:0 auto 20px; }
    .modal-title { font-size:18px; font-weight:700; margin-bottom:20px; letter-spacing:-0.3px; }
    .field { margin-bottom:14px; }
    .field label { display:block; font-size:12px; font-weight:600; color:var(--text2); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.4px; }
    .field input[type=text], .field input[type=number] { width:100%; padding:12px 14px; font-size:16px; border:1.5px solid var(--border2); border-radius:var(--radius-sm); background:var(--bg); color:var(--text); font-family:inherit; outline:none; }
    .field input:focus { border-color:var(--accent); }
    .file-upload-area { border:1.5px dashed var(--border2); border-radius:var(--radius-sm); padding:16px; text-align:center; cursor:pointer; background:var(--bg); color:var(--text2); font-size:14px; position:relative; }
    .file-upload-area input[type=file] { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
    .file-upload-area:hover { border-color:var(--accent); }
    .file-preview { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
    .file-preview-item { display:flex; align-items:center; gap:5px; background:#fff; border:1px solid var(--border2); border-radius:6px; padding:4px 8px; font-size:12px; color:var(--text2); max-width:160px; }
    .file-preview-item span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .file-remove { background:none; border:none; cursor:pointer; color:var(--text3); font-size:13px; padding:0 0 0 4px; flex-shrink:0; line-height:1; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .modal-actions { display:flex; gap:10px; margin-top:20px; }
    .btn-cancel { flex:1; padding:14px; border:1.5px solid var(--border2); border-radius:var(--radius-sm); background:none; cursor:pointer; font-size:15px; font-family:inherit; color:var(--text2); }
    .btn-save { flex:2; padding:14px; border:none; border-radius:var(--radius-sm); background:var(--accent); color:#fff; cursor:pointer; font-size:15px; font-weight:600; font-family:inherit; }

    /* SETUP */
    #setup-screen { display:none; flex-direction:column; align-items:center; justify-content:center; min-height:100dvh; padding:32px 24px; gap:28px; }

    /* FILE VIEWER */
    #file-viewer { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:200; flex-direction:column; align-items:center; justify-content:center; padding:24px; }
    #file-viewer.open { display:flex; }
    #viewer-close { position:absolute; top:calc(16px + env(safe-area-inset-top,0px)); right:16px; background:none; border:none; color:#fff; font-size:28px; cursor:pointer; padding:8px; }
    #viewer-name { color:#fff; font-size:13px; margin-bottom:16px; opacity:0.7; max-width:300px; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #viewer-img { max-width:100%; max-height:70dvh; border-radius:12px; display:none; }
    #viewer-download { margin-top:20px; padding:12px 24px; background:#fff; color:#000; border:none; border-radius:10px; font-size:15px; font-weight:600; cursor:pointer; font-family:inherit; }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-icon">💰</div>
  <div>
    <div class="login-title">Mon Budget</div>
    <div class="login-subtitle" id="login-subtitle">Accès privé</div>
  </div>
  <div class="login-form">
    <input type="password" id="pwd-input" placeholder="Mot de passe" autocomplete="current-password" />
    <div class="login-error" id="login-error"></div>
    <div class="login-warn" id="login-warn"></div>
    <button class="login-btn" id="login-btn" onclick="checkPassword()">Connexion</button>
  </div>
</div>

<!-- SETUP (première utilisation) -->
<div id="setup-screen">
  <div class="login-icon">🔑</div>
  <div>
    <div class="login-title">Créer un mot de passe</div>
    <div class="login-subtitle">Première utilisation — choisissez votre mot de passe</div>
  </div>
  <div class="login-form">
    <input type="password" id="s-pwd1" placeholder="Nouveau mot de passe" autocomplete="new-password" />
    <input type="password" id="s-pwd2" placeholder="Confirmer le mot de passe" autocomplete="new-password" />
    <div class="login-error" id="setup-error"></div>
    <button class="login-btn" onclick="setupPassword()">Créer le mot de passe</button>
  </div>
</div>

<!-- APP -->
<div id="app-screen">
  <div class="safe-top"></div>
  <div class="app">
    <div class="app-header">
      <span class="app-title">Budget</span>
      <div class="header-actions">
        <button class="icon-btn" onclick="logout()" title="Déconnexion">🔒</button>
        <button class="add-btn" onclick="openModal()">+</button>
      </div>
    </div>
    <div class="month-nav">
      <button class="nav-btn" onclick="changeMonth(-1)">&#8249;</button>
      <span class="month-label" id="month-label"></span>
      <button class="nav-btn" onclick="changeMonth(1)">&#8250;</button>
    </div>
    <div class="totals">
      <div class="total-card"><div class="total-label">Total €</div><div class="total-value" id="total-price">—</div></div>
      <div class="total-card"><div class="total-label">Temps</div><div class="total-value" id="total-time">—</div></div>
    </div>
    <div class="section-title">Entrées</div>
    <div class="entries" id="entries-list"></div>
  </div>
  <div class="safe-bot"></div>
</div>

<!-- MODAL AJOUT -->
<div class="overlay" id="overlay" onclick="handleOverlayClick(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Nouvelle entrée</div>
    <div class="field"><label>Titre</label><input type="text" id="f-title" placeholder="Ex: Course, Prestation…" /></div>
    <div class="row">
      <div class="field"><label>Prix (€)</label><input type="number" id="f-price" placeholder="0,00" step="0.01" min="0" inputmode="decimal" /></div>
      <div class="field"><label>Temps (min)</label><input type="number" id="f-time" placeholder="60" min="0" inputmode="numeric" /></div>
    </div>
    <div class="field">
      <label>Fichiers joints (max 2 MB)</label>
      <div class="file-upload-area" id="upload-area">
        📎 Appuyer pour joindre un fichier
        <input type="file" id="f-files" multiple onchange="handleFiles(this)" />
      </div>
      <div class="file-preview" id="file-preview"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Annuler</button>
      <button class="btn-save" onclick="saveEntry()">Ajouter</button>
    </div>
  </div>
</div>

<!-- FILE VIEWER -->
<div id="file-viewer">
  <button id="viewer-close" onclick="closeViewer()">✕</button>
  <div id="viewer-name"></div>
  <img id="viewer-img" alt="aperçu" />
  <button id="viewer-download" onclick="downloadFile()">⬇ Télécharger</button>
</div>

<script>
// ── CONSTANTES ──

const MAX_ATTEMPTS = 5;
const LOCKOUT_MS   = 15 * 60 * 1000; // 15 min
const SESSION_MS   = 30 * 60 * 1000; // 30 min inactivité
const MAX_FILE_BYTES = 2 * 1024 * 1024; // 2 MB
const MONTHS = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];

// ── CRYPTO HELPERS ──
async function sha256(str) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

async function deriveKey(password, salt) {
  const enc = new TextEncoder();
  const raw = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name:"PBKDF2", salt, iterations:200000, hash:"SHA-256" },
    raw, { name:"AES-GCM", length:256 }, false, ["encrypt","decrypt"]
  );
}

async function encrypt(plaintext, password) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv   = crypto.getRandomValues(new Uint8Array(12));
  const key  = await deriveKey(password, salt);
  const enc  = new TextEncoder();
  const ct   = await crypto.subtle.encrypt({ name:"AES-GCM", iv }, key, enc.encode(plaintext));
  const out  = new Uint8Array(salt.length + iv.length + ct.byteLength);
  out.set(salt, 0); out.set(iv, 16); out.set(new Uint8Array(ct), 28);
  return btoa(String.fromCharCode(...out));
}

async function decrypt(b64, password) {
  const raw  = Uint8Array.from(atob(b64), c=>c.charCodeAt(0));
  const salt = raw.slice(0,16);
  const iv   = raw.slice(16,28);
  const ct   = raw.slice(28);
  const key  = await deriveKey(password, salt);
  const pt   = await crypto.subtle.decrypt({ name:"AES-GCM", iv }, key, ct);
  return new TextDecoder().decode(pt);
}

// ── SESSION ──
let sessionKey = null;
let sessionTimer = null;

function resetSessionTimer() {
  clearTimeout(sessionTimer);
  sessionTimer = setTimeout(() => { logout(); }, SESSION_MS);
}

document.addEventListener("touchstart", resetSessionTimer);
document.addEventListener("click", resetSessionTimer);

// ── LOGIN / LOCKOUT ──
function getLockout() {
  const d = JSON.parse(localStorage.getItem("auth_lock") || '{"attempts":0,"until":0}');
  return d;
}
function setLockout(d) { localStorage.setItem("auth_lock", JSON.stringify(d)); }

// ── SETUP (première utilisation) ──
async function setupPassword() {
  const p1 = document.getElementById("s-pwd1").value;
  const p2 = document.getElementById("s-pwd2").value;
  const err = document.getElementById("setup-error");
  if (p1.length < 6) { err.textContent = "Mot de passe trop court (6 caractères min)."; return; }
  if (p1 !== p2)     { err.textContent = "Les mots de passe ne correspondent pas."; return; }
  const hash = await sha256(p1);
  localStorage.setItem("pwd_hash", hash);
  document.getElementById("setup-screen").style.display = "none";
  document.getElementById("login-screen").style.display = "flex";
}

async function checkPassword() {
  const storedHash = localStorage.getItem("pwd_hash");
  if (!storedHash) {
    // pas encore de mot de passe défini
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("setup-screen").style.display = "flex";
    return;
  }

  const lock = getLockout();
  if (lock.until > Date.now()) {
    const mins = Math.ceil((lock.until - Date.now()) / 60000);
    document.getElementById("login-error").textContent = "";
    document.getElementById("login-warn").textContent = `Trop de tentatives. Réessayez dans ${mins} min.`;
    return;
  }

  const val  = document.getElementById("pwd-input").value;
  const hash = await sha256(val);

  if (hash === storedHash) {
    setLockout({ attempts:0, until:0 });
    sessionKey = val;
    sessionStorage.setItem("auth","1");
    resetSessionTimer();
    await loadData();
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("app-screen").style.display = "block";
    render();
  } else {
    lock.attempts = (lock.attempts || 0) + 1;
    const remaining = MAX_ATTEMPTS - lock.attempts;
    if (lock.attempts >= MAX_ATTEMPTS) {
      lock.until = Date.now() + LOCKOUT_MS;
      document.getElementById("login-warn").textContent = "Compte bloqué 15 minutes.";
      document.getElementById("login-error").textContent = "";
      document.getElementById("login-btn").disabled = true;
      setTimeout(() => { document.getElementById("login-btn").disabled = false; document.getElementById("login-warn").textContent = ""; }, LOCKOUT_MS);
    } else {
      document.getElementById("login-error").textContent = `Mot de passe incorrect. ${remaining} tentative(s) restante(s).`;
    }
    setLockout(lock);
    document.getElementById("pwd-input").value = "";
  }
}

document.getElementById("pwd-input").addEventListener("keydown", e => { if (e.key==="Enter") checkPassword(); });
document.getElementById("s-pwd1").addEventListener("keydown", e => { if (e.key==="Enter") document.getElementById("s-pwd2").focus(); });
document.getElementById("s-pwd2").addEventListener("keydown", e => { if (e.key==="Enter") setupPassword(); });

// ── INIT : affiche setup si pas encore de mot de passe ──
(function init() {
  if (!localStorage.getItem("pwd_hash")) {
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("setup-screen").style.display = "flex";
  }
})();

function logout() {
  clearTimeout(sessionTimer);
  sessionKey = null;
  sessionStorage.removeItem("auth");
  entries = [];
  document.getElementById("app-screen").style.display = "none";
  document.getElementById("login-screen").style.display = "flex";
  document.getElementById("pwd-input").value = "";
  document.getElementById("login-error").textContent = "";
  document.getElementById("login-warn").textContent = "";
}

// ── DATA (chiffrée) ──
let entries = [];

async function loadData() {
  const raw = localStorage.getItem("budget_enc");
  if (!raw) { entries = []; return; }
  try {
    const json = await decrypt(raw, sessionKey);
    entries = JSON.parse(json);
  } catch(e) { entries = []; }
}

async function saveData() {
  const json = JSON.stringify(entries);
  const enc  = await encrypt(json, sessionKey);
  localStorage.setItem("budget_enc", enc);
}

// ── FICHIERS TEMPORAIRES ──
let pendingFiles = []; // { name, b64, type }

function handleFiles(input) {
  const preview = document.getElementById("file-preview");
  Array.from(input.files).forEach(file => {
    if (file.size > MAX_FILE_BYTES) {
      alert(`"${file.name}" dépasse 2 MB et ne peut pas être joint.`);
      return;
    }
    const reader = new FileReader();
    reader.onload = e => {
      const b64 = e.target.result;
      const id  = Date.now().toString() + Math.random().toString(36).slice(2);
      pendingFiles.push({ id, name: file.name, b64, type: file.type });

      const item = document.createElement("div");
      item.className = "file-preview-item";
      item.dataset.id = id;
      item.innerHTML = `<span>📎 ${file.name}</span><button class="file-remove" onclick="removePending('${id}')">✕</button>`;
      preview.appendChild(item);
    };
    reader.readAsDataURL(file);
  });
  input.value = "";
}

function removePending(id) {
  pendingFiles = pendingFiles.filter(f => f.id !== id);
  const el = document.querySelector(`.file-preview-item[data-id="${id}"]`);
  if (el) el.remove();
}

// ── RENDER ──
function fmtPrice(v) { return Number(v).toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})+" €"; }
function fmtTime(min) { const h=Math.floor(min/60),m=min%60; return h+" h "+String(m).padStart(2,"0"); }
function fileIcon(type) {
  if (!type) return "📎";
  if (type.startsWith("image/")) return "🖼";
  if (type === "application/pdf") return "📄";
  if (type.includes("word")) return "📝";
  if (type.includes("sheet") || type.includes("excel")) return "📊";
  return "📎";
}

function render() {
  document.getElementById("month-label").textContent = MONTHS[currentMonth]+" "+currentYear;
  const filtered = entries.filter(e => e.month===currentMonth && e.year===currentYear);
  const totalPrice = filtered.reduce((s,e)=>s+(e.price!=null?e.price:0),0);
  const totalTime  = filtered.reduce((s,e)=>s+(e.time!=null?e.time:0),0);
  document.getElementById("total-price").textContent = filtered.some(e=>e.price!=null) ? fmtPrice(totalPrice) : "—";
  document.getElementById("total-time").textContent  = filtered.some(e=>e.time!=null)  ? fmtTime(totalTime)   : "—";

  const list = document.getElementById("entries-list");
  if (!filtered.length) {
    list.innerHTML = '<div class="empty">Aucune entrée ce mois-ci.<br>Appuyez sur <strong>+</strong> pour en ajouter.</div>';
    return;
  }

  list.innerHTML = filtered.slice().reverse().map(e => {
    const filesHtml = e.files && e.files.length
      ? `<div class="files-row">${e.files.map(f=>`
          <div class="file-chip" onclick="viewFile('${e.id}','${f.id}')">
            <span>${fileIcon(f.type)} ${f.name}</span>
          </div>`).join("")}</div>`
      : "";
    return `
      <div class="entry">
        <div class="entry-main">
          <div class="entry-left">
            <div class="entry-title">${e.title}</div>
            <div class="entry-date">${new Date(e.date).toLocaleDateString("fr-FR")}</div>
          </div>
          <div class="entry-values">
            ${e.price!=null?`<div class="entry-price">${fmtPrice(e.price)}</div>`:""}
            ${e.time!=null?`<div class="entry-time">${fmtTime(e.time)}</div>`:""}
          </div>
          <div class="entry-actions">
            <button class="del-btn" onclick="deleteEntry('${e.id}')">✕</button>
          </div>
        </div>
        ${filesHtml}
      </div>`;
  }).join("");
}

// ── NAVIGATION ──
let currentMonth = new Date().getMonth();
let currentYear  = new Date().getFullYear();

function changeMonth(dir) {
  currentMonth += dir;
  if (currentMonth>11){currentMonth=0;currentYear++;}
  if (currentMonth<0){currentMonth=11;currentYear--;}
  render();
}

// ── MODAL ──
function openModal() {
  ["f-title","f-price","f-time"].forEach(id=>document.getElementById(id).value="");
  pendingFiles = [];
  document.getElementById("file-preview").innerHTML = "";
  document.getElementById("overlay").classList.add("open");
  setTimeout(()=>document.getElementById("f-title").focus(),150);
}

function closeModal() { document.getElementById("overlay").classList.remove("open"); }
function handleOverlayClick(e) { if(e.target===document.getElementById("overlay"))closeModal(); }

async function saveEntry() {
  const title = document.getElementById("f-title").value.trim();
  if (!title) { document.getElementById("f-title").focus(); return; }
  const p = document.getElementById("f-price").value;
  const t = document.getElementById("f-time").value;
  entries.push({
    id:    Date.now().toString(),
    title,
    price: p!==""?parseFloat(p):null,
    time:  t!==""?parseInt(t):null,
    date:  new Date().toISOString(),
    month: currentMonth,
    year:  currentYear,
    files: pendingFiles.map(f=>({id:f.id, name:f.name, b64:f.b64, type:f.type}))
  });
  await saveData();
  closeModal();
  render();
}

async function deleteEntry(id) {
  entries = entries.filter(e=>e.id!==id);
  await saveData();
  render();
}

// ── FILE VIEWER ──
let viewerFile = null;

function viewFile(entryId, fileId) {
  const entry = entries.find(e=>e.id===entryId);
  if (!entry) return;
  const file = entry.files.find(f=>f.id===fileId);
  if (!file) return;
  viewerFile = file;
  document.getElementById("viewer-name").textContent = file.name;
  const img = document.getElementById("viewer-img");
  if (file.type && file.type.startsWith("image/")) {
    img.src = file.b64;
    img.style.display = "block";
  } else {
    img.style.display = "none";
  }
  document.getElementById("file-viewer").classList.add("open");
}

function closeViewer() {
  document.getElementById("file-viewer").classList.remove("open");
  document.getElementById("viewer-img").src = "";
  viewerFile = null;
}

function downloadFile() {
  if (!viewerFile) return;
  const a = document.createElement("a");
  a.href = viewerFile.b64;
  a.download = viewerFile.name;
  a.click();
}
</script>
