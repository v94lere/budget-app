<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Mon Budget" />
  <title>Mon Budget</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #f5f4f0; --text: #1a1a18; --text2: #7a7972; --text3: #b0afa8;
      --border: rgba(0,0,0,0.08); --border2: rgba(0,0,0,0.14);
      --accent: #1a1a18; --accent-fg: #ffffff; --danger: #c0392b;
      --radius: 14px; --radius-sm: 9px;
    }
    body { font-family: -apple-system,'SF Pro Text',sans-serif; background: var(--bg); color: var(--text); min-height:100dvh; }
    #setup-screen { display:none; flex-direction:column; align-items:center; justify-content:center; min-height:100dvh; padding:32px 24px; gap:24px; }
    .setup-icon { width:72px; height:72px; background:var(--accent); border-radius:20px; display:flex; align-items:center; justify-content:center; font-size:32px; }
    .setup-title { font-size:22px; font-weight:700; letter-spacing:-0.5px; text-align:center; }
    .setup-sub { font-size:14px; color:var(--text2); text-align:center; line-height:1.6; max-width:280px; }
    .setup-form { width:100%; max-width:320px; display:flex; flex-direction:column; gap:12px; }
    .setup-form input { width:100%; padding:14px 16px; font-size:16px; border:1.5px solid var(--border2); border-radius:var(--radius-sm); background:#fff; color:var(--text); outline:none; font-family:inherit; }
    .setup-form input:focus { border-color:var(--accent); }
    .setup-btn { width:100%; padding:14px; font-size:16px; font-weight:600; background:var(--accent); color:var(--accent-fg); border:none; border-radius:var(--radius-sm); cursor:pointer; font-family:inherit; }
    .setup-error { font-size:13px; color:var(--danger); text-align:center; min-height:18px; }
    #app-screen { display:none; }
    .safe-top { height:env(safe-area-inset-top,0px); }
    .safe-bot { height:calc(env(safe-area-inset-bottom,0px) + 8px); }
    .app { max-width:430px; margin:0 auto; padding:0 16px; }
    .app-header { display:flex; justify-content:space-between; align-items:center; padding:20px 0 16px; }
    .app-title { font-size:28px; font-weight:700; letter-spacing:-0.8px; }
    .header-actions { display:flex; gap:8px; align-items:center; }
    .sync-status { font-size:11px; color:var(--text3); }
    .add-btn { width:38px; height:38px; border-radius:50%; background:var(--accent); border:none; color:#fff; font-size:22px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
    .month-nav { display:flex; align-items:center; justify-content:space-between; background:#fff; border-radius:var(--radius); padding:10px 16px; margin-bottom:14px; border:1px solid var(--border); }
    .nav-btn { background:none; border:none; font-size:20px; color:var(--text2); cursor:pointer; padding:4px 8px; }
    .month-label { font-size:15px; font-weight:600; }
    .totals { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px; }
    .total-card { background:#fff; border-radius:var(--radius); padding:14px 16px; border:1px solid var(--border); }
    .total-label { font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:var(--text3); margin-bottom:4px; }
    .total-value { font-size:22px; font-weight:700; letter-spacing:-0.5px; }
    .section-title { font-size:13px; font-weight:600; color:var(--text2); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:10px; }
    .entries { display:flex; flex-direction:column; gap:8px; padding-bottom:32px; }
    .entry { background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:13px 14px; }
    .entry-main { display:flex; justify-content:space-between; align-items:center; gap:12px; }
    .entry-left { flex:1; min-width:0; }
    .entry-title { font-size:15px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .entry-date { font-size:12px; color:var(--text3); margin-top:2px; }
    .entry-values { text-align:right; flex-shrink:0; }
    .entry-price { font-size:15px; font-weight:600; }
    .entry-time { font-size:12px; color:var(--text2); margin-top:2px; }
    .del-btn { background:none; border:none; cursor:pointer; color:var(--text3); font-size:16px; padding:4px; line-height:1; }
    .files-row { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; padding-top:10px; border-top:1px solid var(--border); }
    .file-chip { display:flex; align-items:center; gap:5px; background:var(--bg); border:1px solid var(--border2); border-radius:6px; padding:4px 8px; font-size:12px; color:var(--text2); cursor:pointer; max-width:160px; }
    .file-chip span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .empty { text-align:center; padding:48px 0 32px; color:var(--text2); font-size:14px; line-height:2; }
    .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:100; align-items:flex-end; justify-content:center; }
    .overlay.open { display:flex; }
    .modal { background:#fff; border-radius:24px 24px 0 0; padding:28px 20px calc(28px + env(safe-area-inset-bottom,0px)); width:100%; max-width:430px; animation:slideUp .25s ease; max-height:90dvh; overflow-y:auto; }
    @keyframes slideUp { from{transform:translateY(60px);opacity:0} to{transform:translateY(0);opacity:1} }
    .modal-handle { width:36px; height:4px; background:var(--border2); border-radius:2px; margin:0 auto 20px; }
    .modal-title { font-size:18px; font-weight:700; margin-bottom:20px; }
    .field { margin-bottom:14px; }
    .field label { display:block; font-size:12px; font-weight:600; color:var(--text2); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.4px; }
    .field input[type=text], .field input[type=number] { width:100%; padding:12px 14px; font-size:16px; border:1.5px solid var(--border2); border-radius:var(--radius-sm); background:var(--bg); color:var(--text); font-family:inherit; outline:none; }
    .field input:focus { border-color:var(--accent); }
    .file-upload-btn { display:block; width:100%; padding:13px; font-size:14px; border:1.5px dashed var(--border2); border-radius:var(--radius-sm); background:var(--bg); color:var(--text2); cursor:pointer; font-family:inherit; text-align:center; }
    .file-upload-btn:hover { border-color:var(--accent); }
    .file-preview { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
    .file-preview-item { display:flex; align-items:center; gap:5px; background:#fff; border:1px solid var(--border2); border-radius:6px; padding:4px 8px; font-size:12px; color:var(--text2); max-width:180px; }
    .file-preview-item span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .file-remove { background:none; border:none; cursor:pointer; color:var(--text3); font-size:13px; padding:0 0 0 4px; flex-shrink:0; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .modal-actions { display:flex; gap:10px; margin-top:20px; }
    .btn-cancel { flex:1; padding:14px; border:1.5px solid var(--border2); border-radius:var(--radius-sm); background:none; cursor:pointer; font-size:15px; font-family:inherit; color:var(--text2); }
    .btn-save { flex:2; padding:14px; border:none; border-radius:var(--radius-sm); background:var(--accent); color:#fff; cursor:pointer; font-size:15px; font-weight:600; font-family:inherit; }
    #file-viewer { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:200; flex-direction:column; align-items:center; justify-content:center; padding:24px; }
    #file-viewer.open { display:flex; }
    #viewer-close { position:absolute; top:calc(16px + env(safe-area-inset-top,0px)); right:16px; background:none; border:none; color:#fff; font-size:28px; cursor:pointer; padding:8px; }
    #viewer-name { color:#fff; font-size:13px; margin-bottom:16px; opacity:0.7; max-width:300px; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #viewer-img { max-width:100%; max-height:70dvh; border-radius:12px; display:none; }
    #viewer-download { margin-top:20px; padding:12px 24px; background:#fff; color:#000; border:none; border-radius:10px; font-size:15px; font-weight:600; cursor:pointer; font-family:inherit; }
    #toast { position:fixed; bottom:calc(24px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%) translateY(80px); background:#1a1a18; color:#fff; padding:10px 20px; border-radius:20px; font-size:13px; opacity:0; transition:all .3s ease; z-index:300; white-space:nowrap; pointer-events:none; }
    #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<div id="setup-screen">
  <div class="setup-icon">💰</div>
  <div class="setup-title">Mon Budget</div>
  <div class="setup-sub">Configuration initiale.<br>Entrez le code fourni.</div>
  <div class="setup-form">
    <input type="password" id="s-token" placeholder="Code d'accès" autocomplete="off" />
    <div class="setup-error" id="setup-error"></div>
    <button class="setup-btn" onclick="setupToken()">Continuer</button>
  </div>
</div>

<div id="app-screen">
  <div class="safe-top"></div>
  <div class="app">
    <div class="app-header">
      <span class="app-title">Mon Budget</span>
      <div class="header-actions">
        <span class="sync-status" id="sync-status"></span>
        <button class="add-btn" id="open-modal-btn">+</button>
      </div>
    </div>
    <div class="month-nav">
      <button class="nav-btn" id="prev-btn">&#8249;</button>
      <span class="month-label" id="month-label"></span>
      <button class="nav-btn" id="next-btn">&#8250;</button>
    </div>
    <div class="totals">
      <div class="total-card"><div class="total-label">Total €</div><div class="total-value" id="total-price">—</div></div>
      <div class="total-card"><div class="total-label">Temps</div><div class="total-value" id="total-time">—</div></div>
    </div>
    <div class="section-title">Entrées</div>
    <div class="entries" id="entries-list"></div>
  </div>
  <div class="safe-bot"></div>
</div>

<!-- input file caché, déclenché par le bouton -->
<input type="file" id="file-input" multiple style="display:none" />

<div class="overlay" id="overlay">
  <div class="modal" id="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Nouvelle entrée</div>
    <div class="field">
      <label>Titre</label>
      <input type="text" id="f-title" placeholder="Ex: Courses, Médecin…" />
    </div>
    <div class="row">
      <div class="field">
        <label>Prix (€)</label>
        <input type="number" id="f-price" placeholder="0,00" step="0.01" min="0" inputmode="decimal" />
      </div>
      <div class="field">
        <label>Temps (min)</label>
        <input type="number" id="f-time" placeholder="60" min="0" inputmode="numeric" />
      </div>
    </div>
    <div class="field">
      <label>Fichiers joints (max 10 MB)</label>
      <button type="button" class="file-upload-btn" id="pick-file-btn">📎 Appuyer pour joindre un fichier</button>
      <div class="file-preview" id="file-preview"></div>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn-cancel" id="cancel-btn">Annuler</button>
      <button type="button" class="btn-save" id="save-btn">Ajouter</button>
    </div>
  </div>
</div>

<div id="file-viewer">
  <button id="viewer-close">✕</button>
  <div id="viewer-name"></div>
  <img id="viewer-img" alt="aperçu" />
  <button id="viewer-download">⬇ Télécharger</button>
</div>

<div id="toast"></div>

<script>
var GIST_ID   = "fe6bbcd9c76caa4c8539f370c6e31dd2";
var GIST_FILE = "data.json";
var MAX_BYTES = 10 * 1024 * 1024; // 10 MB
var MONTHS    = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];

var GH_TOKEN     = localStorage.getItem("gh_token") || "";
var entries      = [];
var pendingFiles = [];
var viewerFile   = null;
var curMonth     = new Date().getMonth();
var curYear      = new Date().getFullYear();

// ── SETUP ──
document.getElementById("s-token").addEventListener("keydown", function(e){ if(e.key==="Enter") setupToken(); });

async function setupToken() {
  var val = document.getElementById("s-token").value.trim();
  var err = document.getElementById("setup-error");
  if (!val.startsWith("ghp_") && !val.startsWith("github_pat_")) {
    err.textContent = "Code invalide. Contactez votre fils."; return;
  }
  err.textContent = "Vérification…";
  var ok = await testToken(val);
  if (!ok) { err.textContent = "Code incorrect ou expiré."; return; }
  localStorage.setItem("gh_token", val);
  GH_TOKEN = val;
  document.getElementById("setup-screen").style.display = "none";
  document.getElementById("app-screen").style.display = "block";
  await loadData();
  render();
}

async function testToken(token) {
  try {
    var r = await fetch("https://api.github.com/gists/" + GIST_ID, {
      headers: { "Authorization": "token " + token, "Accept": "application/vnd.github.v3+json" }
    });
    return r.ok;
  } catch(e) { return false; }
}

// ── GIST ──
async function loadData() {
  setSyncStatus("⏳");
  try {
    var r = await fetch("https://api.github.com/gists/" + GIST_ID, {
      headers: { "Authorization": "token " + GH_TOKEN, "Accept": "application/vnd.github.v3+json" }
    });
    if (!r.ok) throw new Error();
    var gist = await r.json();
    var raw  = gist.files[GIST_FILE] ? gist.files[GIST_FILE].content : "[]";
    entries  = JSON.parse(raw);
    setSyncStatus("✓");
  } catch(e) {
    entries = JSON.parse(localStorage.getItem("budget_local") || "[]");
    setSyncStatus("⚠️ hors ligne");
  }
}

async function saveData() {
  localStorage.setItem("budget_local", JSON.stringify(entries));
  setSyncStatus("⏳");
  try {
    var body = { files: {} };
    body.files[GIST_FILE] = { content: JSON.stringify(entries) };
    var r = await fetch("https://api.github.com/gists/" + GIST_ID, {
      method: "PATCH",
      headers: {
        "Authorization": "token " + GH_TOKEN,
        "Accept": "application/vnd.github.v3+json",
        "Content-Type": "application/json"
      },
      body: JSON.stringify(body)
    });
    if (!r.ok) throw new Error();
    setSyncStatus("✓");
    showToast("Sauvegardé ✓");
  } catch(e) {
    setSyncStatus("⚠️ non sync");
    showToast("Sauvegarde locale uniquement");
  }
}

function setSyncStatus(s) { document.getElementById("sync-status").textContent = s; }

function showToast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(function(){ t.classList.remove("show"); }, 2500);
}

// ── RENDER ──
function fmtPrice(v) { return Number(v).toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})+" €"; }
function fmtTime(min) { var h=Math.floor(min/60),m=min%60; return h+"h"+String(m).padStart(2,"0"); }
function fileIcon(type) {
  if (!type) return "📎";
  if (type.startsWith("image/")) return "🖼";
  if (type==="application/pdf") return "📄";
  return "📎";
}

function render() {
  document.getElementById("month-label").textContent = MONTHS[curMonth]+" "+curYear;
  var filtered   = entries.filter(function(e){ return e.month===curMonth && e.year===curYear; });
  var totalPrice = filtered.reduce(function(s,e){ return s+(e.price!=null?e.price:0); }, 0);
  var totalTime  = filtered.reduce(function(s,e){ return s+(e.time!=null?e.time:0); }, 0);
  document.getElementById("total-price").textContent = filtered.some(function(e){return e.price!=null;}) ? fmtPrice(totalPrice) : "—";
  document.getElementById("total-time").textContent  = filtered.some(function(e){return e.time!=null;})  ? fmtTime(totalTime)   : "—";

  var list = document.getElementById("entries-list");
  if (!filtered.length) {
    list.innerHTML = '<div class="empty">Aucune entrée ce mois-ci.<br>Appuyez sur <strong>+</strong> pour en ajouter.</div>';
    return;
  }
  list.innerHTML = filtered.slice().reverse().map(function(e) {
    var filesHtml = "";
    if (e.files && e.files.length) {
      filesHtml = '<div class="files-row">' + e.files.map(function(f){
        return '<div class="file-chip" data-eid="'+e.id+'" data-fid="'+f.id+'"><span>'+fileIcon(f.type)+" "+f.name+'</span></div>';
      }).join("") + '</div>';
    }
    return '<div class="entry">' +
      '<div class="entry-main">' +
        '<div class="entry-left">' +
          '<div class="entry-title">'+e.title+'</div>' +
          '<div class="entry-date">'+new Date(e.date).toLocaleDateString("fr-FR")+'</div>' +
        '</div>' +
        '<div class="entry-values">' +
          (e.price!=null?'<div class="entry-price">'+fmtPrice(e.price)+'</div>':'') +
          (e.time!=null?'<div class="entry-time">'+fmtTime(e.time)+'</div>':'') +
        '</div>' +
        '<button class="del-btn" data-id="'+e.id+'">✕</button>' +
      '</div>' + filesHtml + '</div>';
  }).join("");

  // délégation d'événements — évite les onclick inline
  list.querySelectorAll(".del-btn").forEach(function(btn){
    btn.addEventListener("click", function(){ deleteEntry(this.dataset.id); });
  });
  list.querySelectorAll(".file-chip").forEach(function(chip){
    chip.addEventListener("click", function(){ viewFile(this.dataset.eid, this.dataset.fid); });
  });
}

// ── NAVIGATION ──
document.getElementById("prev-btn").addEventListener("click", function(){ changeMonth(-1); });
document.getElementById("next-btn").addEventListener("click", function(){ changeMonth(1); });

function changeMonth(dir) {
  curMonth += dir;
  if (curMonth > 11) { curMonth = 0; curYear++; }
  if (curMonth < 0)  { curMonth = 11; curYear--; }
  render();
}

// ── MODAL ──
document.getElementById("open-modal-btn").addEventListener("click", openModal);
document.getElementById("cancel-btn").addEventListener("click", closeModal);
document.getElementById("save-btn").addEventListener("click", saveEntry);
document.getElementById("overlay").addEventListener("click", function(e){
  if (e.target === this) closeModal();
});
// empêche le clic sur le modal de fermer
document.getElementById("modal").addEventListener("click", function(e){ e.stopPropagation(); });

function openModal() {
  document.getElementById("f-title").value = "";
  document.getElementById("f-price").value = "";
  document.getElementById("f-time").value  = "";
  pendingFiles = [];
  document.getElementById("file-preview").innerHTML = "";
  document.getElementById("overlay").classList.add("open");
  setTimeout(function(){ document.getElementById("f-title").focus(); }, 150);
}

function closeModal() {
  document.getElementById("overlay").classList.remove("open");
}

// ── FICHIERS ──
document.getElementById("pick-file-btn").addEventListener("click", function(){
  document.getElementById("file-input").click();
});

document.getElementById("file-input").addEventListener("change", function(){
  var preview = document.getElementById("file-preview");
  Array.from(this.files).forEach(function(file){
    if (file.size > MAX_BYTES) { showToast('"'+file.name+'" dépasse 10 MB'); return; }
    var reader = new FileReader();
    reader.onload = function(ev){
      var id = Date.now().toString(36) + Math.random().toString(36).slice(2);
      pendingFiles.push({ id:id, name:file.name, b64:ev.target.result, type:file.type });
      var item = document.createElement("div");
      item.className = "file-preview-item";
      item.dataset.id = id;
      item.innerHTML = '<span>📎 '+file.name+'</span><button class="file-remove">✕</button>';
      item.querySelector(".file-remove").addEventListener("click", function(){ removePending(id); });
      preview.appendChild(item);
    };
    reader.readAsDataURL(file);
  });
  this.value = ""; // reset pour permettre re-sélection du même fichier
});

function removePending(id) {
  pendingFiles = pendingFiles.filter(function(f){ return f.id !== id; });
  var el = document.querySelector('.file-preview-item[data-id="'+id+'"]');
  if (el) el.remove();
}

async function saveEntry() {
  var title = document.getElementById("f-title").value.trim();
  if (!title) { document.getElementById("f-title").focus(); return; }
  var p = document.getElementById("f-price").value;
  var t = document.getElementById("f-time").value;
  entries.push({
    id:    Date.now().toString(),
    title: title,
    price: p !== "" ? parseFloat(p) : null,
    time:  t !== "" ? parseInt(t)   : null,
    date:  new Date().toISOString(),
    month: curMonth,
    year:  curYear,
    files: pendingFiles.map(function(f){ return {id:f.id, name:f.name, b64:f.b64, type:f.type}; })
  });
  closeModal();
  render();
  await saveData();
}

async function deleteEntry(id) {
  entries = entries.filter(function(e){ return e.id !== id; });
  render();
  await saveData();
}

// ── FILE VIEWER ──
document.getElementById("viewer-close").addEventListener("click", closeViewer);
document.getElementById("viewer-download").addEventListener("click", downloadFile);

function viewFile(entryId, fileId) {
  var entry = entries.find(function(e){ return e.id===entryId; });
  if (!entry || !entry.files) return;
  var file = entry.files.find(function(f){ return f.id===fileId; });
  if (!file) return;
  viewerFile = file;
  document.getElementById("viewer-name").textContent = file.name;
  var img = document.getElementById("viewer-img");
  if (file.type && file.type.startsWith("image/")) { img.src = file.b64; img.style.display = "block"; }
  else { img.style.display = "none"; }
  document.getElementById("file-viewer").classList.add("open");
}

function closeViewer() {
  document.getElementById("file-viewer").classList.remove("open");
  document.getElementById("viewer-img").src = "";
  viewerFile = null;
}

function downloadFile() {
  if (!viewerFile) return;
  var a = document.createElement("a");
  a.href = viewerFile.b64;
  a.download = viewerFile.name;
  a.click();
}

// ── INIT ──
(function(){
  if (!GH_TOKEN) {
    document.getElementById("setup-screen").style.display = "flex";
  } else {
    document.getElementById("app-screen").style.display = "block";
    loadData().then(function(){ render(); });
  }
})();
</script>
</body>
</html>
